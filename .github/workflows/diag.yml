name: diag
on: [push, workflow_dispatch]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 25}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "9.8.2"}
      - run: chmod +x gradlew && ./gradlew build --no-daemon || true
      - if: always()
        run: |
          JAR=$(find ~/.gradle /home/runner -name "minecraft-merged*.jar" 2>/dev/null | head -1)
          echo "JAR=$JAR"
          javap -p -classpath "$JAR" net.minecraft.client.Minecraft | head -80
          echo "=== UseItemCallback ==="
          FJ=$(find ~/.gradle -path "*fabric-use-item*" -name "*.jar" 2>/dev/null | head -1)
          echo "FJ=$FJ"
          if [ -n "$FJ" ]; then unzip -l "$FJ" | head -20; fi
          FJ2=$(find ~/.gradle -name "fabric-api-*.jar" 2>/dev/null | head -1)
          echo "FJ2=$FJ2"
